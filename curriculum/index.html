<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>كلماتي في دروسي | بالعربية لوّنت عالمي</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:18px Tahoma,Arial,sans-serif;color:#244f53;background:#f6f4e9}header{height:72px;padding:10px 4vw;display:flex;align-items:center;gap:12px;background:#fffdf5;border-bottom:1px solid #dce2d4}header img{width:38px;height:48px;object-fit:contain}header strong{flex:1}a,button{font:inherit;color:inherit;text-decoration:none;cursor:pointer;touch-action:manipulation}header a,button{border:0;border-radius:16px;min-height:48px;padding:11px 16px;background:#e1ece2}a:focus-visible,button:focus-visible{outline:3px solid #d8ac4c;outline-offset:3px}main{height:calc(100dvh - 72px);max-width:1100px;margin:auto;padding:26px;display:flex;flex-direction:column;gap:20px}.hero{background:linear-gradient(120deg,#dceef3,#f5e6b9);border-radius:27px;padding:26px}h1,h2,p{margin:0}h1{font-size:clamp(28px,5vw,45px);margin-bottom:12px}p{line-height:1.7}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0;align-content:center}.card{display:flex;flex-direction:column;align-items:center;gap:14px;border:2px solid #dbe2d3;border-radius:28px;padding:25px;background:#fffdf6;min-height:220px;text-align:center;justify-content:center}.card:nth-child(2){background:#eef5f5}.card .number{display:grid;place-items:center;border-radius:24px;width:90px;height:90px;background:#dfecdc;color:#648b60;font-size:54px;font-weight:bold}.card:nth-child(2) .number{background:#d9e9ed;color:#4e8597}.card h2{font-size:clamp(23px,4vw,32px)}.card span{font-size:16px;color:#73847a}.subject{grid-column:1/-1;min-height:250px;background:linear-gradient(130deg,#eef5df,#fff7db);border-color:#d8dfbd}.subject .number{font-size:38px;background:#dbe9cd}.foot{color:#75847b;font-size:14px;text-align:center}.back{align-self:flex-start}.crumb{color:#71847a;font-size:15px}@media(max-width:600px){header{height:64px;padding:8px 12px;gap:8px}header strong{font-size:16px}header a{font-size:14px;padding:10px}header img{width:30px;height:40px}main{height:calc(100dvh - 64px);padding:15px;gap:14px}.hero{padding:20px}h1{font-size:29px}.hero p{font-size:16px}.cards{grid-template-columns:1fr;gap:12px}.card{min-height:145px;padding:17px;gap:9px;display:grid;grid-template-columns:75px 1fr;text-align:right}.card .number{grid-row:1/3;width:70px;height:70px;font-size:42px}.card h2{font-size:23px}.card span{font-size:14px}.subject{grid-column:auto}.foot{font-size:12px}}@media(max-height:500px) and (orientation:landscape){header{height:54px}main{height:calc(100dvh - 54px);padding:12px;gap:10px}.hero{padding:12px 20px}.hero h1{font-size:28px;margin:0}.hero p{display:none}.cards{grid-template-columns:1fr 1fr}.card{min-height:130px;padding:12px;gap:8px}.card .number{height:55px;width:55px;font-size:34px}.card h2{font-size:23px}.card span{font-size:13px}.subject{min-height:130px}}
/* Short hub screens */@media(orientation:portrait) and (max-height:680px){main{padding:12px;gap:10px}.hero{padding:14px}.hero h1{font-size:24px;margin-bottom:7px}.hero p{font-size:14px}.cards{grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:100px;padding:12px;grid-template-columns:58px 1fr}.card .number{width:55px;height:55px;font-size:34px}.card h2{font-size:21px}.card span{font-size:12px}.subject{grid-row:1/-1}.foot{font-size:11px}}</style></head><body><header><a href="../" aria-label="العودة للموقع الرئيسي">⌂ الرئيسية</a><img src="school-logo.png" alt="شعار المدرسة"><strong>بالعربية لوّنت عالمي</strong></header><main id="hub"></main><script>
const hub=document.getElementById('hub');function render(){const g=new URLSearchParams(location.hash.slice(1)).get('grade');if(g==='4'||g==='5'){const label=g==='4'?'الرابع':'الخامس';hub.innerHTML=`<button class="back" id="back">الصفوف</button><div class="hero"><p class="crumb">كلماتي في دروسي</p><h1>الصف ${label}</h1><p>اختاري المادة، ثم اكتشفي كلمات دروسكِ.</p></div><div class="cards"><a class="card subject" href="science-${g}.html?v=activity1"><div class="number">علوم</div><h2>العلوم</h2><span>الجزء الأول · خمس وحدات وعشرة دروس</span></a></div><p class="foot">أكتشف المعنى، أستمع، وأتحدّى نفسي.</p>`;document.getElementById('back').onclick=()=>{history.replaceState(null,'',location.pathname);render()};return}hub.innerHTML=`<div class="hero"><h1>كلماتي في دروسي</h1><p>أفهم كلمات دروسي بالصور والصوت، وأجمع النجوم في تحدّيات متنوعة.</p></div><h2>اختاري الصف</h2><div class="cards"><a class="card" href="#grade=4"><div class="number">٤</div><h2>الصف الرابع</h2><span>مفرداتي في العلوم</span></a><a class="card" href="#grade=5"><div class="number">٥</div><h2>الصف الخامس</h2><span>مفرداتي في العلوم</span></a></div><p class="foot">اختيار مصطلح وصورة ← مطابقة ← كتابة</p>`}addEventListener('hashchange',render);render();
</script></body></html>
